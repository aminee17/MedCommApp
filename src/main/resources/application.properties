# Application Name
spring.application.name=medical_mobile_app

# Database Configuration - RENDER.COM SPECIFIC
# Render provides DATABASE_URL in format: postgresql://user:pass@host:port/dbname
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medical_app}?sslmode=require
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}

# Connection Pool Configuration - OPTIMIZED FOR RENDER
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Server Configuration
server.port=${PORT:10000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyForMedicalAppThatShouldBeVeryLongAndSecureForHS512Algorithm1234567890123456789012345678901234567890}
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://medcommapp-frontend.onrender.com,http://localhost:3000,http://localhost:19006}

# Security Configuration (Temporarily disabled for development)
# Remove this line in production
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.na.medical_mobile_app=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Additional Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Timezone Configuration
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# PDF Storage
pdf.storage.directory=/tmp/pdf-storage

# Render Specific Optimizations
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false